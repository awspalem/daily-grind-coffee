<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Page Not Found · The Daily Grind</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/src/styles/index.css">
  <style>
    .not-found-page {
      max-width: 560px;
      margin: 0 auto;
      padding: 6rem 1.5rem 7rem;
      text-align: center;
    }
    .not-found-page .eyebrow {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-terracotta);
    }
    .not-found-page h1 {
      font-family: var(--font-serif);
      font-size: 2.4rem;
      margin: 0.6rem 0 1rem;
    }
    .not-found-page p {
      color: var(--text-muted);
      line-height: 1.7;
      font-size: 1rem;
      margin-bottom: 2rem;
    }
    .not-found-page .actions {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 8h1a4 4 0 1 1 0 8h-1"></path>
          <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path>
          <line x1="6" y1="2" x2="6" y2="4"></line>
          <line x1="10" y1="2" x2="10" y2="4"></line>
          <line x1="14" y1="2" x2="14" y2="4"></line>
        </svg>
        <div>
          <span class="brand-name">THE DAILY GRIND</span>
          <span class="brand-tagline">Bangalore Roastery · Est. 2026</span>
        </div>
      </a>
    </div>
  </header>

  <main class="not-found-page">
    <span class="eyebrow">404 — Grounds Not Found</span>
    <h1>This page didn't make it through the roast.</h1>
    <p>The link you followed may be broken, or the page may have moved. Let's get you back to something delicious.</p>
    <div class="actions">
      <a href="/" class="btn-primary">Back to the Roastery</a>
      <a href="/#catalog" class="btn-secondary">Browse Roasts</a>
    </div>
  </main>
</body>
</html>
