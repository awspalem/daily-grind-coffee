name = "daily-grind-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
STOREFRONT_URL = "http://localhost:5173"
ADMIN_URL = "http://localhost:5174"
CURRENCY = "usd"
GROQ_MODEL = "llama-3.3-70b-versatile"
SHIPROCKET_PICKUP_LOCATION = "Primary"

# Shiprocket secrets (set via `wrangler secret put <NAME>`, not committed here):
#   SHIPROCKET_EMAIL             — Shiprocket account login email
#   SHIPROCKET_PASSWORD          — Shiprocket account login password
#   SHIPROCKET_WEBHOOK_TOKEN     — required in production; also entered as the webhook
#                                   secret in Shiprocket dashboard > Settings > API > Webhooks
#   SHIPROCKET_USD_TO_INR_RATE   — optional, defaults to 83. Shiprocket order values are
#                                   always INR; orders billed in USD are converted using this
#                                   rate. Auto-push only fires for India-bound shipments
#                                   (shipping_address.country === 'IN'); everything else falls
#                                   back to the existing manual tracking_number/carrier flow.
# Without SHIPROCKET_EMAIL/PASSWORD, ShiprocketService runs in mock mode outside production
# so order fulfillment keeps working; in production it fails loudly instead of faking data.

# Resend email secrets (set via `wrangler secret put <NAME>`, not committed here):
#   RESEND_API_KEY     — from resend.com/api-keys. Without it, order confirmation emails are
#                          skipped (logged, not sent) rather than failing checkout.
#   RESEND_FROM_EMAIL   — optional, e.g. "The Daily Roast <orders@yourdomain.com>". Defaults to
#                          Resend's shared onboarding@resend.dev sender, which only delivers to
#                          the Resend account's own verified email until a sending domain is
#                          verified in the Resend dashboard.

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "daily-grind-db"
database_id = "660152c1-a81d-433a-99e6-d3d99827da57"
migrations_dir = "../../packages/db/migrations"

# Cloudflare R2 Bucket Binding — product catalog images (apps/api/src/routes/media.ts).
# `wrangler dev` simulates this locally with no Cloudflare auth needed. The bucket itself is
# created by the CI deploy workflow (`npx wrangler r2 bucket create daily-grind-media`).
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "daily-grind-media"

# Cloudflare KV Namespace Binding
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "local-kv-config-id"

# Cloudflare Workers AI Binding
[ai]
binding = "AI"

# Cloudflare Queues (Uncomment when Workers Paid Plan is enabled)
# [[queues.producers]]
# binding = "JOB_QUEUE"
# queue = "daily-grind-jobs"

# [[queues.consumers]]
# queue = "daily-grind-jobs"
# max_batch_size = 10
# max_batch_timeout = 5
# max_retries = 3

# Scheduled Cron Triggers
[triggers]
crons = ["0 4 * * *"] # Daily 4:00 AM UTC stock audit & backup

# Production environment overrides — deploy with `wrangler deploy --env production`.
# Without this, `ENVIRONMENT` stays "development" even on a live deploy, which keeps
# ShiprocketService in mock mode (fake tracking numbers reach real customers) AND leaves the
# admin API's Zero Trust guard in its dev-bypass mode (see middleware/zeroTrust.ts) — wide open.
#
# `name` must be pinned here: Wrangler suffixes the Worker name with the environment name by
# default (daily-grind-api-production), which would silently split traffic onto a second Worker
# at a different *.workers.dev URL. Pinning it keeps the same Worker/URL as the default env.
[env.production]
name = "daily-grind-api"

# Custom domain (needed so Cloudflare Access can protect this API — Access cannot be applied to
# a bare *.workers.dev subdomain) is DISABLED for now: the CLOUDFLARE_API_TOKEN used in CI lacks
# the Zone:Workers Routes:Edit permission needed to auto-provision it, which was hard-failing
# every deploy. Once that token permission is granted, re-add:
#   [[env.production.routes]]
#   pattern = "daily-grind-api.rohithpalem.in"
#   custom_domain = true
# and switch API_BASE in apps/admin/src/main.ts back to that hostname.

[env.production.vars]
ENVIRONMENT = "production"
STOREFRONT_URL = "https://daily-grind-storefront.pages.dev" # real working Pages URL — swap for a custom domain once one is set up
ADMIN_URL = "https://daily-grind-admin.pages.dev" # real working Pages URL — swap for a custom domain once one is set up
CURRENCY = "usd"
GROQ_MODEL = "llama-3.3-70b-versatile"
SHIPROCKET_PICKUP_LOCATION = "Primary"

# Named environments do NOT inherit top-level bindings in Wrangler — each one needs its
# own copy, confirmed via `wrangler deploy --env production --dry-run`.
[[env.production.d1_databases]]
binding = "DB"
database_name = "daily-grind-db"
database_id = "660152c1-a81d-433a-99e6-d3d99827da57"
migrations_dir = "../../packages/db/migrations"

[[env.production.kv_namespaces]]
binding = "CONFIG_KV"
id = "local-kv-config-id" # placeholder — replace with your real production KV namespace id

[env.production.ai]
binding = "AI"

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "daily-grind-media"

[env.production.triggers]
crons = ["0 4 * * *"]

# Secrets are per-environment too: `wrangler secret put SHIPROCKET_EMAIL --env production`
# (repeat for SHIPROCKET_PASSWORD and SHIPROCKET_WEBHOOK_TOKEN).
