name: Deploy The Daily Grind to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-api:
    name: Deploy Cloudflare Worker API & D1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Monorepo Packages
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Provision D1, R2, Queues & KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd apps/api
          
          # 1. Provision Cloudflare Queue
          npx wrangler queues create daily-grind-jobs || true

          # 2. Provision R2 Bucket
          npx wrangler r2 bucket create daily-grind-media || true

          # 3. Provision Cloudflare D1 Database
          npx wrangler d1 create daily-grind-db || true
          D1_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="daily-grind-db") | .uuid')
          echo "Discovered D1 Database UUID: $D1_ID"
          if [ -n "$D1_ID" ] && [ "$D1_ID" != "null" ]; then
            sed -i "s/database_id = \".*\"/database_id = \"$D1_ID\"/" wrangler.toml
          fi

          # 4. Provision Cloudflare KV Namespace
          npx wrangler kv:namespace create CONFIG_KV || true
          KV_ID=$(npx wrangler kv:namespace list --json | jq -r '.[] | select(.title | contains("CONFIG_KV")) | .id')
          echo "Discovered KV ID: $KV_ID"
          if [ -n "$KV_ID" ] && [ "$KV_ID" != "null" ]; then
            sed -i "s/id = \"local-kv-config-id\"/id = \"$KV_ID\"/" wrangler.toml
          fi

      - name: Apply D1 Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd apps/api
          npx wrangler d1 migrations apply daily-grind-db --remote
          npx wrangler d1 execute daily-grind-db --remote --file=../../packages/db/seeds/seed_catalog.sql || true

      - name: Deploy Worker API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd apps/api
          npx wrangler deploy

  deploy-storefront:
    name: Deploy Storefront to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Storefront
        run: npm run build --workspace=apps/storefront

      - name: Deploy Pages to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create daily-grind-storefront --production-branch=main || true
          npx wrangler pages deploy apps/storefront/dist --project-name=daily-grind-storefront

  deploy-admin:
    name: Deploy Admin Portal to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Admin Portal
        run: npm run build --workspace=apps/admin

      - name: Deploy Admin Pages to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create daily-grind-admin --production-branch=main || true
          npx wrangler pages deploy apps/admin/dist --project-name=daily-grind-admin
