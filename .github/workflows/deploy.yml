name: Deploy The Daily Roast to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-api:
    name: Deploy Cloudflare Worker API & D1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Monorepo Packages
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Configure KV and Queues
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd apps/api
          
          # Create Queue if needed
          npx wrangler queues create daily-grind-jobs || true

          # Discover or create KV namespace
          KV_ID=$(npx wrangler kv:namespace list | jq -r '.[] | select(.title | contains("CONFIG_KV")) | .id' | head -n 1)
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            npx wrangler kv:namespace create CONFIG_KV || true
            KV_ID=$(npx wrangler kv:namespace list | jq -r '.[] | select(.title | contains("CONFIG_KV")) | .id' | head -n 1)
          fi
          
          echo "Discovered KV Namespace ID: $KV_ID"
          if [ -n "$KV_ID" ] && [ "$KV_ID" != "null" ]; then
            sed -i "s/id = \"local-kv-config-id\"/id = \"$KV_ID\"/" wrangler.toml
          fi

          # Attempt R2 bucket creation (non-blocking if not yet enabled in UI)
          npx wrangler r2 bucket create daily-grind-media || true

      - name: Apply D1 Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd apps/api
          npx wrangler d1 migrations apply daily-grind-db --remote --env production
          npx wrangler d1 execute daily-grind-db --remote --env production --file=../../packages/db/seeds/seed_catalog.sql || true

      - name: Deploy Worker API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          cd apps/api
          if [ -n "$GROQ_API_KEY" ]; then
            echo "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY --env production || true
          fi
          if [ -n "$RESEND_API_KEY" ]; then
            echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --env production || true
          fi
          npx wrangler deploy --env production

  deploy-storefront:
    name: Deploy Storefront to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Storefront
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=apps/storefront

      - name: Deploy Pages to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create daily-grind-storefront --production-branch=main || true
          npx wrangler pages deploy apps/storefront/dist --project-name=daily-grind-storefront

  deploy-admin:
    name: Deploy Admin Portal to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Admin Portal
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=apps/admin

      - name: Deploy Admin Pages to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create daily-grind-admin --production-branch=main || true
          npx wrangler pages deploy apps/admin/dist --project-name=daily-grind-admin
