name: CI PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Monorepo (Topological)
        run: npm run build

      - name: Run E2E & Unit Test Suites
        run: npm test
